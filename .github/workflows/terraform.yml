name: Terraform

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Déployer le groupe de ressources Azure"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  terraform:
    name: Vérification et plan
    runs-on: ubuntu-22.04

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Vérifier le format
        run: terraform fmt -check -recursive

      - name: Initialiser Terraform
        run: terraform init -input=false

      - name: Valider la configuration
        run: terraform validate

      - name: Générer le plan du groupe de ressources
        run: terraform plan -input=false -target=azurerm_resource_group.lab -out=tfplan

      - name: Déployer le groupe de ressources
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan